# Seal build: the Java implementation's test suite (lang/java/build.sh test:
# `mvn -B test` then `mvn -B test -Phadoop3`), run natively on the JDK 8 and
# JDK 11 legs upstream runs it on. The Yetus/Docker multi-language harness and
# the Windows C#-only leg are not used: they test the C/C++/C#/Python/Ruby/PHP/
# Perl/JS implementations, none of which ship in the org.apache.avro:avro jar.
# Checkstyle (test phase) and spotless (compile phase) are lint gates, skipped.

language: java

env:
  global:
    - VERSION=1.9.2
    - MVN_GATES="-Dcheckstyle.skip=true -Dspotless.check.skip=true"

matrix:
  include:
  - jdk: openjdk8
    env: JAVA=8

  - jdk: openjdk11
    env: JAVA=11

install: true

script:
  - cd lang/java
  - mvn -B -V test $MVN_GATES
  - $TRAVIS_BUILD_DIR/.travis/print-test-results.sh
  - mvn -B test -Phadoop3 $MVN_GATES
  - $TRAVIS_BUILD_DIR/.travis/print-test-results.sh
