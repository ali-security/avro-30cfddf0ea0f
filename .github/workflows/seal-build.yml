# Seal build-and-pack workflow. Apache Avro 1.9.2 has no GitHub Actions CI of its
# own; its test suite runs on Travis (.travis.yml). This job only builds and
# uploads the org.apache.avro:avro jar and its -tests jar.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: "1.9.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Package avro module
        working-directory: lang/java
        run: mvn -B -V package -DskipTests -Dcheckstyle.skip=true -Dspotless.check.skip=true -pl avro -am
      - uses: actions/upload-artifact@v4
        with:
          name: avro-jars
          path: |
            lang/java/avro/target/avro-1.9.2.jar
            lang/java/avro/target/avro-1.9.2-tests.jar
          if-no-files-found: error
